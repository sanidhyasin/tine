name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Vet, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: make vet

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0 # keep in sync with GOLANGCI_LINT_VERSION in the Makefile

      - name: Unit tests
        run: make test

      - name: Build
        run: make build

  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6

      - name: Lint
        run: uvx ruff check src tests && uvx ruff format --check src tests

      - name: Tests (against a fake tined)
        run: uv run --group dev pytest -q
